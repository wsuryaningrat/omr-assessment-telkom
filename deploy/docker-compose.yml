# VPS 2 CPU / 2 GB: Postgres + API (+ Caddy untuk HTTPS). Jalankan dari root repo:
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omr
      POSTGRES_USER: omr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi di .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    mem_limit: 384m
  api:
    build: { context: .., dockerfile: Dockerfile.server }
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql+psycopg://omr:${POSTGRES_PASSWORD}@db:5432/omr
      UPLOAD_DIR: /data/uploads
      SCAN_WORKERS: ${SCAN_WORKERS:-2}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?isi di .env}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:?isi di .env (acak, panjang)}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_DOMAINS: ${ADMIN_DOMAINS:-}
      GSHEET_URL: ${GSHEET_URL:-}
      GSHEET_CREDENTIALS: ${GSHEET_CREDENTIALS:-}
    volumes: [uploads:/data/uploads]
    mem_limit: 1200m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
volumes: { pgdata: {}, uploads: {}, caddy_data: {} }
