<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#BA0C2F">
<title>Evaluasi LJK — Telkom University</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/style.css">
<script defer src="/vendor/alpine.min.js"></script>
<script src="/app.js"></script>
</head>
<body x-data="ljk()" x-cloak>

<header><div class="in">
  <img src="/logo.png" alt="Telkom University">
  <h1>Evaluasi LJK<small>Profiling Literasi Numerik</small></h1>
  <button class="btn sm" x-show="sid" @click="resetAll()" x-transition.opacity>Baru</button>
</div></header>

<main class="wrap" x-show="ready">

  <nav class="steps" aria-label="Tahap">
    <div class="step" :class="{on: step===1, done: step>1}"><b x-text="step>1?'✓':'1'"></b><span>Unggah</span></div>
    <div class="step" :class="{on: step===2, done: step>2}"><b x-text="step>2?'✓':'2'"></b><span>Validasi</span></div>
    <div class="step" :class="{on: step===3}"><b>3</b><span>Selesai</span></div>
  </nav>

  <!-- TAHAP 1: identitas + unggah -->
  <section x-show="step===1">
    <div class="card" x-show="!sid">
      <div class="grid">
        <div class="full">
          <label class="f" for="nama">Nama Lengkap Pengawas</label>
          <input id="nama" x-model.trim="form.nama" autocomplete="name" placeholder="Nama lengkap">
        </div>
        <div>
          <label class="f" for="hp">Nomor HP</label>
          <input id="hp" x-model.trim="form.hp" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx">
          <div class="err" x-show="form.hp && !phoneOk">Nomor HP tidak valid</div>
        </div>
        <div>
          <label class="f" for="rg">Ruangan</label>
          <input id="rg" x-model.trim="form.ruangan" placeholder="Contoh: TULT 0603">
        </div>
        <div class="mfull">
          <label class="f" for="fk">Fakultas Mahasiswa</label>
          <select id="fk" x-model="form.fakultas" @change="form.prodi=''">
            <option value="">— Pilih fakultas —</option>
            <template x-for="f in Object.keys(meta.fakultas_prodi||{})" :key="f"><option :value="f" x-text="f"></option></template>
          </select>
        </div>
        <div class="mfull">
          <label class="f" for="pr">Program Studi</label>
          <select id="pr" x-model="form.prodi" :disabled="!form.fakultas">
            <option value="" x-text="form.fakultas?'— Pilih program studi —':'Pilih fakultas dulu'"></option>
            <template x-for="p in prodiOptions" :key="p"><option :value="p" x-text="p"></option></template>
          </select>
        </div>
      </div>
    </div>

    <div class="who" x-show="sid && session">
      <span>👤 <b x-text="session?.pengawas?.nama"></b></span><span>· <span x-text="session?.pengawas?.ruangan"></span></span>
      <span>· <span x-text="(session?.pengawas?.fakultas||'').split(' - ')[0]"></span> / <span x-text="session?.pengawas?.prodi"></span></span>
    </div>

    <label class="drop" :class="{hot: dragging}" @dragover.prevent="dragging=true" @dragleave="dragging=false" @drop.prevent="dragging=false; pick($event.dataTransfer.files)">
      <div class="big">📤</div>
      <b x-text="formValid || sid ? 'Pilih / foto LJK' : 'Lengkapi identitas dulu'"></b>
      <p>JPG · PNG · HEIC · PDF · maks. <span x-text="meta.max_upload_mb||10"></span> MB per berkas</p>
      <input type="file" multiple accept="image/*,.pdf,.heic,.heif" hidden @change="pick($event.target.files); $event.target.value=''">
    </label>

    <div class="card" style="margin-top:10px" x-show="up.total>0 && up.done<up.total">
      <div class="prog"><span>Mengunggah…</span><span x-text="up.done+' / '+up.total"></span></div>
      <div class="bar"><i :style="`width:${up.total?up.done/up.total*100:0}%`"></i></div>
    </div>
    <div class="card" style="margin-top:10px" x-show="session?.scanning">
      <div class="prog"><span><span class="spin"></span> Memindai LJK…</span><span x-text="scanDone+' / '+(session?.files.total||0)+' berkas'"></span></div>
      <div class="bar"><i :style="`width:${scanPct}%`"></i></div>
    </div>
  </section>

  <!-- TAHAP 2: validasi -->
  <section x-show="step===2">
    <div class="who">
      <span>👤 <b x-text="session?.pengawas?.nama"></b></span><span>· <span x-text="session?.pengawas?.ruangan"></span></span>
    </div>

    <div class="card" x-show="session?.scanning" style="padding:10px 12px">
      <div class="prog" style="margin:0 0 6px"><span><span class="spin"></span> Memindai berkas berikutnya…</span><span x-text="scanDone+' / '+session.files.total"></span></div>
      <div class="bar"><i :style="`width:${scanPct}%`"></i></div>
    </div>

    <div class="stats">
      <div class="stat"><b x-text="session?.summary.lembar||0"></b><small>Lembar</small></div>
      <div class="stat"><b style="color:var(--ok)" x-text="session?.summary.ok||0"></b><small>Tervalidasi</small></div>
      <div class="stat"><b style="color:var(--warn)" x-text="(session?.summary.perlu_validasi||0)+(session?.summary.gagal||0)"></b><small>Perlu tindakan</small></div>
    </div>

    <template x-for="f in (session?.files.failed||[])" :key="f.name+f.error"><div class="fail">⚠️ <b x-text="f.name"></b>: <span x-text="f.error"></span></div></template>

    <div class="tabs">
      <button class="tab" :class="{on: filter==='all'}" @click="filter='all'">Semua</button>
      <button class="tab" :class="{on: filter==='todo'}" @click="filter='todo'">Perlu validasi</button>
      <button class="tab" :class="{on: filter==='bad'}" @click="filter='bad'">Gagal <span x-text="session?.summary.gagal||''"></span></button>
    </div>

    <template x-for="s in filtered" :key="s.id">
      <div class="row" :class="rowCls(s)">
        <div class="main" @click="open(s)">
          <div class="nm" x-text="s.nama && s.nama!=='-' ? s.nama : '(nama tidak terbaca)'"></div>
          <div class="meta">
            <span class="mono" x-text="s.npm"></span><span>Kode <b x-text="s.kode_soal"></b></span><span>Terisi <b x-text="s.terisi"></b></span>
            <span class="chip" :class="rowCls(s)" x-show="s.label==='Gagal'">Gagal</span>
          </div>
        </div>
        <button class="icon" :class="{go: s.validated}" :disabled="s.label==='Gagal'" @click="toggle(s)" :aria-label="s.validated?'Batalkan validasi':'Validasi'" x-text="s.validated?'✓':'○'"></button>
      </div>
    </template>
    <p x-show="!filtered.length" style="text-align:center;color:var(--ink2);padding:18px 0" x-text="session?.scanning?'Menunggu hasil pindai…':'Tidak ada lembar di filter ini.'"></p>
  </section>

  <!-- TAHAP 3: selesai -->
  <section x-show="step===3">
    <div class="card done">
      <div class="big">✅</div>
      <h2 style="margin:6px 0 2px">Data berhasil disubmit</h2>
      <p style="color:var(--ink2);margin:0 0 14px"><span x-text="session?.summary.lembar"></span> lembar LJK tersimpan.</p>
      <button class="btn p" @click="resetAll()">Evaluasi baru</button>
    </div>
  </section>
</main>

<!-- bar bawah -->
<div class="bottom" x-show="ready && step===1 && !sid">
  <div class="in"><div style="flex:1;color:var(--ink2);font-size:13px;align-self:center" x-text="formHint"></div></div>
</div>
<div class="bottom" x-show="ready && step===2">
  <div class="in">
    <button class="btn" @click="validateAll(session.summary.ok < session.summary.lembar - session.summary.gagal)" :disabled="!session?.summary.lembar" x-text="allValid ? '↩ Batalkan' : '✓ Validasi semua'"></button>
    <button class="btn p" @click="submit()" :disabled="!canSubmit || busy" style="flex:1.4">
      <span x-show="busy" class="spin"></span><span x-text="'Submit ('+(session?.summary.ok||0)+'/'+(session?.summary.lembar||0)+')'"></span>
    </button>
  </div>
</div>

<!-- detail lembar -->
<template x-if="sel">
  <div>
    <div class="veil" @click="close()"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="grab"></div>
      <h3 x-text="sel.nama && sel.nama!=='-' ? sel.nama : '(nama tidak terbaca)'"></h3>
      <div class="sub"><span class="chip" :class="rowCls(sel)" x-text="sel.label"></span> <span x-text="sel.file"></span></div>
      <dl class="kv">
        <dt>NPM</dt><dd class="mono" x-text="sel.npm"></dd>
        <dt>Fakultas (LJK)</dt><dd x-text="sel.fakultas_ljk"></dd>
        <dt>Kode soal</dt><dd x-text="sel.kode_soal"></dd>
        <dt>Jawaban terisi</dt><dd x-text="sel.terisi"></dd>
      </dl>
      <div class="fail" x-show="sel.label==='Gagal'">Pojok LJK tidak terdeteksi — ganti dengan foto baru.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" @click="showPreview()" :disabled="sel.label==='Gagal'||pv.loading">🖼️ <span x-text="pv.url?'Muat ulang preview':'Tampilkan preview'"></span></button>
        <label class="btn sm">🔁 Ganti foto<input type="file" accept="image/*,.pdf,.heic,.heif" hidden @change="replace($event.target.files[0]); $event.target.value=''"></label>
        <button class="btn sm" style="color:var(--bad)" @click="remove(sel)">🗑️ Hapus</button>
      </div>
      <div class="skel" x-show="pv.loading" style="margin-top:8px"></div>
      <img class="pv" x-show="pv.url && !pv.loading" :src="pv.url" @load="pv.loading=false" @error="pv.loading=false; toast('Preview gagal dimuat', true)" alt="Preview hasil scan">
      <p x-show="pv.url && !pv.loading" style="font-size:12px;color:var(--ink2);margin:6px 0 0">Hijau = jawaban terbaca · merah = terisi ganda</p>
      <div class="sticky-act">
        <button class="btn" style="flex:1" @click="close()">Tutup</button>
        <button class="btn p" style="flex:1.4" :disabled="sel.label==='Gagal'" @click="toggle(sel); close()" x-text="sel.validated?'Batalkan validasi':'✓ Validasi'"></button>
      </div>
    </div>
  </div>
</template>

<div class="toast" :class="{bad: msg.bad}" x-show="msg.text" x-text="msg.text" x-transition.opacity></div>
</body>
</html>
